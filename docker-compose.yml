services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geo_resolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_resolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-geo_resolution}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
