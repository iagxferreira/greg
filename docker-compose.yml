services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geo_resolution_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_resolution}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres runs any *.sql here (alphabetically) on first init of an empty
      # data dir -- our numbered migrations apply themselves automatically.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-geo_resolution}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: geo_resolution_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot job: pulls the models resolve_country needs, then exits. Re-running
  # `docker compose up` is cheap -- `ollama pull` no-ops once a model is cached
  # in the ollama_data volume.
  ollama-init:
    image: ollama/ollama:latest
    container_name: geo_resolution_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull mistral:latest && ollama pull nomic-embed-text"]
    restart: "no"

volumes:
  postgres_data:
  ollama_data:
