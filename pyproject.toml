[project]
name = "geo-resolution-rag"
version = "0.1.0"
description = "RAG-based geo-resolution engine: disambiguates partial/misspelled/ambiguous location names using vector search (pgvector) and an LLM (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-ollama",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
