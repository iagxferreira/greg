[project]
name = "geo-resolution-rag"
version = "0.1.0"
description = "RAG-based geo-resolution engine: disambiguates partial/misspelled/ambiguous location names using vector search (pgvector) and an LLM (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-ollama",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.0.7",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# LLM prompt text is natural-language prose, not code — don't force-wrap it.
"src/prompt.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
